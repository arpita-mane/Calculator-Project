<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11111b">
    <title>Calculator — Simple, by design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Simple Calculator home">
          <span class="brand-icon" aria-hidden="true">÷</span>
          <span>calc<span class="brand-dot">.</span></span>
        </a>
        <span class="topbar-label"><span class="status-dot"></span> READY TO CALCULATE</span>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="intro">
          <p class="eyebrow">YOUR EVERYDAY CALCULATOR</p>
          <h1>Simple, by design<span>.</span></h1>
          <p class="subtitle">A little clarity for your numbers.</p>
        </div>

        <div class="calc-card">
          <div class="display" aria-live="polite" aria-atomic="true">
            <div class="expression" id="expression"></div>
            <output class="result" id="display" aria-label="Current value">0</output>
          </div>
          <div class="keypad" aria-label="Calculator keys">
            <button class="key key-utility" type="button" data-action="clear">AC</button>
            <button class="key key-utility" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
            <button class="key key-utility" type="button" data-action="percent" aria-label="Percent">%</button>
            <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

            <button class="key" type="button" data-digit="7">7</button>
            <button class="key" type="button" data-digit="8">8</button>
            <button class="key" type="button" data-digit="9">9</button>
            <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

            <button class="key" type="button" data-digit="4">4</button>
            <button class="key" type="button" data-digit="5">5</button>
            <button class="key" type="button" data-digit="6">6</button>
            <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

            <button class="key" type="button" data-digit="1">1</button>
            <button class="key" type="button" data-digit="2">2</button>
            <button class="key" type="button" data-digit="3">3</button>
            <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

            <button class="key key-zero" type="button" data-digit="0">0</button>
            <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
          </div>
          <p class="keyboard-hint">TIP <span>Use your keyboard, too</span></p>
        </div>
        <p class="footer-note">Made for the moments that call for a quick answer.</p>
      </section>
    </main>
  </body>
</html>
